# voiced on the OnePlus 6 — deployed to ~/agentic/voiced.conf.
# Engines are the ones the phone actually has (L2-D1), run in throwaway
# containers so the existing `voice` container is never touched (L2-D2).
agentd = http://127.0.0.1:8770
stt = cmd $HOME/agentic/bin/stt-moonshine.sh
tts = cmd $HOME/agentic/bin/tts-ptts.sh
play = none
quiet = true
lock = $HOME/agentic/voiced.mic.lock
language = en
