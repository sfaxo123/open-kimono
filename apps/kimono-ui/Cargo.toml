[package]
name = "kimono-fx"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A2: recorded trace-events fixtures for the kimono open-kimono view — generated straight from the trace-events schema, no LLM in the loop"

# The fixtures must be byte-true to the wire format, so they are GENERATED by
# the same crate that defines it. Only in-repo deps, per the Track A rule.
[dependencies]
trace-events = { path = "../../crates/trace-events" }
# Only for the JSON `Value` fields the AG-UI vocabulary carries (tool results,
# state snapshots). Same version trace-events already pulls in.
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[[bin]]
name = "kimono-fx"
path = "src/main.rs"
