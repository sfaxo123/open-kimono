# voiced on the OnePlus 6 — CV0 warm path. A NEW config copy: the
# deployed voiced.conf and voiced-tonight.conf are untouched and stay
# the cold-path fallback. Same audible semantics as voiced-tonight.conf
# (play = paplay, quiet = false); the engines are the persistent warm
# services (voiced-warm-stt / voiced-warm-tts) that wakeword.sh
# start/stop manages alongside the listener.
agentd = http://127.0.0.1:8770
stt = cmd $HOME/agentic/bin/stt-moonshine-warm.sh
tts = cmd $HOME/agentic/bin/tts-ptts-warm.sh
play = paplay
quiet = false
lock = $HOME/agentic/voiced.mic.lock
language = en
ack_clips = $HOME/agentic/acks/got-it.wav $HOME/agentic/acks/one-sec.wav
ack_delay_ms = 1500
