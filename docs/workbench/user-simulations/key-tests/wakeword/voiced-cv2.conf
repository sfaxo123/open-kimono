# voiced on the OnePlus 6 — CV2 Smart Turn path. A NEW config copy in
# the CV0 pattern: voiced.conf, voiced-tonight.conf and voiced-cv0.conf
# are untouched and stay the fallbacks. Identical to voiced-cv0.conf
# plus the Smart Turn judge: live captures consult the warm
# voiced-smartturn service at each trailing-silence pause, so a
# mid-sentence pause no longer cuts the turn (and a finished turn can
# end earlier than the fixed 0.7 s hangover). If the judge is down or
# slow, voiced falls back to the CV0 endpointing and journals it.
agentd = http://127.0.0.1:8770
stt = cmd $HOME/agentic/bin/stt-moonshine-warm.sh
tts = cmd $HOME/agentic/bin/tts-ptts-warm.sh
smart_turn = cmd $HOME/agentic/bin/smartturn-judge.sh
play = paplay
quiet = false
lock = $HOME/agentic/voiced.mic.lock
language = en
ack_clips = $HOME/agentic/acks/got-it.wav $HOME/agentic/acks/one-sec.wav
ack_delay_ms = 1500
