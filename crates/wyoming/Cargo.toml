[package]
name = "wyoming"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of the Wyoming framed protocol (JSONL header + optional data/payload blocks) used by Home Assistant voice services"

# Adapted from https://github.com/rhasspy/wyoming (MIT), commit 08a0c25.
# See docs/PROVENANCE.md in the redox-oneplus6 repository.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
